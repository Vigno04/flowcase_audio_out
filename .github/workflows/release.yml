name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build binary
        run: pkg . --targets node18-linux-${{ matrix.arch }} --output flowcase_audio_out_linux

      - name: Package
        run: |
          ARCH_NAME=${{ matrix.arch }}
          if [ "$ARCH_NAME" = "x64" ]; then
            ARCH_NAME="amd64"
          fi
          mkdir -p dist
          mv flowcase_audio_out_linux dist/
          cd dist
          tar -czvf ../flowcase_audio_out_linux_${ARCH_NAME}.tar.gz flowcase_audio_out_linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-out-${{ matrix.arch }}
          path: flowcase_audio_out_linux_*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Release v1.0.0
          draft: false
          prerelease: false
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
